# Lavalink 4.2.x server configuration for dragbot.  Lavalink 4.2+ is REQUIRED: Discord now uses end-to-end
# encrypted ("DAVE") voice and older Lavalink versions can no longer play audio.
server:
  port: 2333
  # 0.0.0.0 works almost everywhere. Railway's private network needs "::" - the Dockerfile sets that for you.
  address: "${LAVALINK_BIND_ADDRESS:0.0.0.0}"

lavalink:
  plugins:
    # Lavalink's built-in YouTube source was retired; this plugin replaces it.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"   # set LAVALINK_SERVER_PASSWORD as a variable!
    sources:
      youtube: false      # handled by the plugin above
      soundcloud: true    # works on hosting servers even when YouTube is blocked
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10        # best Opus quality
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:              # tried in this order
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # --- If YouTube blocks your server ("Sign in to confirm you're not a bot"), uncomment ONE of these ---
    # Use a THROWAWAY Google account, never your main one. Add the "TV" client above when using oauth.
    # oauth:
    #   enabled: true
    #   refreshToken: "paste-refresh-token-here"
    # pot:
    #   token: "paste-po_token-here"
    #   visitorData: "paste-visitor_data-here"

logging:
  level:
    root: INFO
    lavalink: INFO

services:
  lavalink:
    build: ./lavalink
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD:-youshallnotpass}
    expose:
      - "2333"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_FILE: /app/storage/data.json
      MUSIC_BACKEND: ${MUSIC_BACKEND:-auto}
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_PASSWORD: ${LAVALINK_SERVER_PASSWORD:-youshallnotpass}
      LAVALINK_SECURE: "false"
      LAVALINK_SEARCH: ${LAVALINK_SEARCH:-ytsearch,scsearch}
    volumes:
      - ./storage:/app/storage
